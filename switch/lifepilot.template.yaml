version: 2

# ============================================================================
# LifePilot — Switch template
#
# Defines one shared room (`lifepilot`), three focused agents, and the user.
# Import this file in the Switch Console template importer (or pass it to the
# `create_room_from_yaml` workflow) and choose your Telegram or Discord bridge.
#
# The rule that shapes every agent below: SHOW, ASK, THEN SAVE.
# No agent may write to storage or change a plan before the user says yes.
#
# IMPORTANT — WHERE THE INTELLIGENCE LIVES
# Each agent below is a *thin shell*. It does not re-derive priorities, parse
# dates, or invent plans; it calls the LifePilot backend, which is plain Python
# with 148 tests. This keeps one implementation of every rule instead of two,
# and it means what the agents say in this room is exactly what the API returns.
#
# Before importing this template, run the backend on the agent machine:
#     cd {directory} && uvicorn backend.main:app --host 0.0.0.0 --port 8000
# ============================================================================

params:
  bridge:
    type: bridge
    label: Chat bridge
    description: Telegram or Discord bridge for the shared LifePilot room.
    default: ["My Discord", "My Telegram"]
    required: true

  machine:
    type: machine
    label: Agent machine
    description: The online machine where the three LifePilot agents run.
    default: ["Sumit"]
    required: true

  provider:
    type: provider
    label: Agent provider
    description: Agent provider used for each LifePilot agent.
    default: ["codex"]
    required: true

  directory:
    type: directory
    label: Project directory
    description: Directory containing the LifePilot backend that the agents can read.
    default: "."
    required: true

  user:
    type: user
    label: LifePilot user
    description: The chat username to invite into the room.
    default: "sushil9151"
    required: true

  wake_up_time:
    type: string
    label: Wake-up time
    description: When the morning briefing should arrive (24h, HH:MM).
    default: "07:00"
    required: false

  reminder_time:
    type: string
    label: Evening reminder time
    description: When the evening review should arrive (24h, HH:MM).
    default: "20:00"
    required: false


resources:

  # --------------------------------------------------------------------------
  # Agent 1 — Capture
  # --------------------------------------------------------------------------
  capture_agent:
    type: agent
    name: capture-agent
    display_name: LifePilot Capture
    description: Turns messages, links, OCR lines, and voice notes into classified, structured items.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{directory}"
    addressing: anyone
    allow_existing: true
    instructions: |
      You are the Capture agent for LifePilot. You are a thin shell over the
      LifePilot backend. Do NOT parse dates, guess priorities, or invent
      categories yourself — the backend does that, deterministically, and shows
      its reasoning.

      To understand a message, run exactly this command, replacing the text with
      what the user wrote:

        curl -s -X POST http://localhost:8000/chat \
          -H "Content-Type: application/json" \
          -d '{"message": "finish biology notes by Friday", "sender": "capture-room"}'

      The response is JSON containing a "reply" field. Post that "reply" to the
      room verbatim. It already says what was understood and asks for
      confirmation.

      When the user answers yes or no, run the same command again with their
      answer as the message, using the SAME sender value. That is how the
      backend knows which pending proposal is being answered:

        curl -s -X POST http://localhost:8000/chat \
          -H "Content-Type: application/json" \
          -d '{"message": "yes", "sender": "capture-room"}'

      Rules:
        - Quote the user's words inside double quotes in the JSON. If their
          message contains a double quote, replace it with a single quote
          rather than producing broken JSON.
        - Never say a task was saved unless the command output says it saved.
        - Never summarise or restyle the reply. Post it as written.
        - If the command fails, say so plainly: "I can't reach the LifePilot
          backend on port 8000." Do not invent an answer.

  # --------------------------------------------------------------------------
  # Agent 2 — Planner
  # --------------------------------------------------------------------------
  planner_agent:
    type: agent
    name: planner-agent
    display_name: LifePilot Planner
    description: Prioritises tasks, detects conflicts, and proposes daily and study plans.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{directory}"
    addressing: anyone
    allow_existing: true
    instructions: |
      You are the Planner agent for LifePilot. You are a thin shell over the
      LifePilot backend. Ranking, conflict detection and the three-priority cap
      are implemented in tested Python — do not do them in your head.

      For a daily plan, run:

        curl -s -X POST http://localhost:8000/chat \
          -H "Content-Type: application/json" \
          -d '{"message": "plan my day", "sender": "planner-room"}'

      For a study plan, send the user's own words, for example:

        curl -s -X POST http://localhost:8000/chat \
          -H "Content-Type: application/json" \
          -d '{"message": "study plan for biology exam on 2026-11-20, 20 hours available", "sender": "planner-room"}'

      Post the "reply" field from the response to the room verbatim.

      When the user answers yes or no, repeat the call with their answer as the
      message and the SAME sender value. Only then does the backend save.

      Rules:
        - Never re-rank, re-word, or add tasks the backend did not return.
        - Never postpone or delete anything yourself. The backend proposes; the
          user approves.
        - If the command fails, say "I can't reach the LifePilot backend on
          port 8000" rather than inventing a plan.

  # --------------------------------------------------------------------------
  # Agent 3 — Reminder
  # --------------------------------------------------------------------------
  reminder_agent:
    type: agent
    name: reminder-agent
    display_name: LifePilot Reminder
    description: Delivers briefings, bill reminders, and the evening review.
    provider: "{provider}"
    machine: "{machine}"
    directory: "{directory}"
    addressing: anyone
    allow_existing: true
    instructions: |
      You are the Reminder agent for LifePilot. You are a thin shell over the
      LifePilot backend. Do not compute dates, bills or rankings yourself.

      The three things you post, and the exact commands that produce them:

      Morning briefing:
        curl -s -X POST http://localhost:8000/briefings/morning

      Evening review:
        curl -s -X POST http://localhost:8000/briefings/evening

      Anything else the user asks about reminders, bills or due dates:
        curl -s -X POST http://localhost:8000/chat \
          -H "Content-Type: application/json" \
          -d '{"message": "what bills are due", "sender": "reminder-room"}'

      Each command returns JSON with a "message" (for the two briefing
      endpoints) or a "reply" (for /chat). Post that text to the room verbatim.

      Rules:
        - You are read-only by nature: these commands never change a task.
        - If the user asks you to move, postpone or delete something, call /chat
          with their words and post the reply. The backend will raise a
          proposal that needs their yes. Never claim you changed anything.
        - Never say a reminder was sent if the command failed. Say "I can't
          reach the LifePilot backend on port 8000."
        - Keep the posted text exactly as returned — it is already short.

  # --------------------------------------------------------------------------
  # The shared room
  # --------------------------------------------------------------------------
  lifepilot_room:
    type: room
    name: lifepilot
    description: The shared LifePilot room — one user and three approval-first agents.
    bridge: "{bridge}"
    channel_type: channel_public
    agents:
      - capture_agent
      - planner_agent
      - reminder_agent
    users:
      - "{user}"
    aliases:
      capture_agent: capture
      planner_agent: planner
      reminder_agent: reminder
    instructions: |
      This is the LifePilot room. The room is the interface; there is no web
      frontend.

      Ground rules for all three agents:
        - Show what you understood before acting.
        - Ask for approval before saving, rescheduling, or deleting anything.
        - Never pretend an action was completed when it was not.
        - Keep every reply short, specific, and honest about what is pending.
        - State the exact action taken, in one line.

      Route intent roughly as follows:
        - "add a task / remember / track / log" or a bare statement → Capture
        - "plan my day / prioritise / what should I do" → Planner
        - "study plan / exam" → Planner
        - "morning briefing / bills due / wrap up my day / evening review" → Reminder
        - General questions and progress updates → Assistant, with no task proposal

      Periodic progress check-ins ask how one open task is going. They only
      read data; they never complete, postpone, or delete a task.

    kickoff: >-
      Welcome to LifePilot. This room is your personal life operating system.
      You can say things like:

        • add a task — finish biology notes by Friday, high priority
        • plan my day
        • track a bill — internet, 1200, due on the 15th, monthly
        • study plan — biology exam on 2026-11-15, 20 hours available
        • morning briefing
        • wrap up my day

      Three agents are here to help. Capture reads what you write and shows you
      exactly what it understood before saving anything. Planner ranks your
      tasks, spots clashing deadlines, and proposes a plan of at most three
      priorities. Reminder sends your morning briefing, bill reminders, and
      evening review.

      You can also ask general questions about LifePilot; those get a direct
      answer rather than a task proposal. Nothing is saved, moved, or deleted
      without your yes. Start by telling me one thing you need to get done.
